name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/console_state.test.js
      - run: python scripts/validate-plugin.py .
      - run: python scripts/privacy-scan.py . --release
      - run: git show --check --oneline HEAD
